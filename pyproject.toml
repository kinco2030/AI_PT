[project]
name = "ai-pt"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "dhxiwbdow", email = "dhxiwbdow@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "gradio>=6.32.0",
    "matplotlib>=3.11.2",
    "mediapipe>=1.2.3",
    "numpy>=2.4.6",
    "opencv-python>=5.1.0.95",
    "pandas>=3.1.1",
    "scikit-learn>=1.9.1",
    "seaborn>=0.13.2",
]

[project.scripts]
ai-pt = "ai_pt:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"
