[project]
name = "ai-pt"
version = "0.1.0"
description = "Local AI PT trainer with Gradio"
readme = "README.md"
authors = [
    { name = "dhxiwbdow", email = "dhxiwbdow@gmail.com" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "gradio==5.49.1",
    "mediapipe==0.10.35",
    "opencv-contrib-python==4.14.0.94",
    "numpy==2.5.5",
    "pandas==2.3.3",
    "matplotlib==3.11.2",
    "pyttsx3==2.99",
    "fastapi==0.163.1",
    "uvicorn==0.54.0",
    "starlette==0.52.1",
]

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"
